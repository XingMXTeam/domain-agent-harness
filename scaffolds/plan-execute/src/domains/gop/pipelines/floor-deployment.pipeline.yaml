# 子流水线 —— 单个楼层：样式包 → 排期 → 发布
# 作用域里有父流水线传进来的 floor / activity / nations
name: floor-deployment
description: 单楼层投放：建样式包 → 配排期 → 发布，由主流水线按楼层 foreach 展开

output:
  floorName: ${floor.floorName}
  style: ${style}
  schedule: ${schedule}
  publish: ${publish}

steps:
  - id: style
    agent: agents/style-builder.md
    input: { floor: "${floor}", activity: "${activity}", nations: "${nations}" }
    schema: schemas/style-results.schema.json
    description: 为这个楼层创建样式包（写接口，不重试，避免重复创建）

  - id: schedule
    agent: agents/schedule-builder.md
    when: ${style.results.0.success}
    input: { floor: "${floor}", style: "${style}" }
    schema: schemas/schedule-result.schema.json
    description: 样式包建成功才配排期

  - id: publish
    agent: agents/floor-publisher.md
    when: ${schedule.results.0.success}
    input: { floor: "${floor}", style: "${style}", schedule: "${schedule}" }
    schema: schemas/publish-result.schema.json
    description: 排期写成功才发布
