# 主流水线 —— plan → 每个楼层跑一遍子流水线（并发 4） → review
name: deployment
description: 投放主流程：规划 → 按楼层并发投放（样式包 → 排期 → 发布） → 只读校验

steps:
  - id: plan
    agent: agents/deployment-planner.md       # outputSchema 写在 Agent frontmatter 里
    input: ${user_prompt}
    output: deployment_plan
    retries: 1                                # 只读步骤，输出不合规可以放心重试
    description: 只读知识库，产出投放计划

  - id: floors
    foreach: ${deployment_plan.floors}
    parallel: 4
    pipeline: pipelines/floor-deployment.pipeline.yaml
    input:
      floor: ${item}
      activity: ${deployment_plan.activity}
      nations: ${deployment_plan.nations}
    output: floor_results
    description: 每个楼层独立跑一遍「样式包 → 排期 → 发布」，一个楼层一个子作用域

  - id: review
    agent: agents/deployment-reviewer.md
    when: ${floor_results}
    input:
      plan: ${deployment_plan}
      floors: ${floor_results}
    output: deployment_report
    retries: 1
    description: 只读校验投放结果
